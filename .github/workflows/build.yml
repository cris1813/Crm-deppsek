name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Preparar proyecto, Wllama y dependencias
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @wllama/wllama@3.5.1
          
          # Empaquetamos Wllama localmente dentro del APK
          mkdir -p www/wllama
          cp -r node_modules/@wllama/wllama/* www/wllama/

          # Inicializar proyecto con ID único
          npx cap init "CRM Clientes" "cl.cristobal.crm" --web-dir www
          npx cap add android

          # Habilitar memoria extendida (largeHeap) para que Android no cierre la app con el modelo
          sed -i 's/<application/<application android:largeHeap="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CRM-Clientes.apk

      - name: Publicar APK suelto en Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes || true
          git tag -d v1.0 || true
          git push --delete origin v1.0 || true
          gh release create v1.0 \
            android/app/build/outputs/apk/debug/CRM-Clientes.apk \
            --title "CRM Clientes (DeepSeek Offline)" \
            --notes "APK con motor Wllama y memoria largeHeap configurada."
